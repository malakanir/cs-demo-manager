name: csdm_mobile
description: "CS2 2D replay viewer for .csdmm match exports."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  sqlite3: ^3.8.0
  dio: ^5.11.1
  bonsoir: ^7.1.6
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/maps.json
    - assets/radars/cs2/
